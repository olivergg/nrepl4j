# nrepl4j-spring-boot-starter - values below are the defaults, spelled out for
# documentation. Remove this file entirely and the starter behaves the same way.

# Set to false to disable the embedded nREPL server.
clojure.nrepl.enabled=true

# Port scan range: tries start-port, then increments until end-port (exclusive).
clojure.nrepl.start-port=5555
clojure.nrepl.end-port=6666

# Never a wildcard address (0.0.0.0 / :: / ::0) - see the lib's README security section.
clojure.nrepl.bind=127.0.0.1

# Extra .clj classpath resources to load, in addition to helpers.clj and spring.clj.
clojure.nrepl.extra-resources=
