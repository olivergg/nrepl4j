name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          gpg-private-key: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          gpg-passphrase: JRELEASER_GPG_PASSPHRASE

      - name: Derive release version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set project version
        run: |
          mvn -s .mvn/settings.xml -q -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          cd spring-boot-starter
          mvn -s ../.mvn/settings.xml -q -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          mvn -s ../.mvn/settings.xml -q -B versions:set-property -Dproperty=nrepl4j.version -DnewVersion="$RELEASE_VERSION"

      - name: Install nrepl4j locally (dependency of the starter)
        run: mvn -s .mvn/settings.xml -B clean install

      - name: Stage nrepl4j
        run: mvn -s .mvn/settings.xml -B -Prelease deploy

      - name: Stage nrepl4j-spring-boot-starter
        working-directory: spring-boot-starter
        run: mvn -s ../.mvn/settings.xml -B -Prelease clean deploy

      - name: Publish to Maven Central via JReleaser
        uses: jreleaser/release-action@v2
        with:
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.RELEASE_VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_NREPL4J_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_NREPL4J_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_MAVENCENTRAL_NREPL4J_SPRING_BOOT_STARTER_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_NREPL4J_SPRING_BOOT_STARTER_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
