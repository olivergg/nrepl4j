name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          gpg-private-key: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Derive release version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set project version
        run: |
          mvn -s .mvn/settings.xml -q -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          cd spring-boot-starter
          mvn -s ../.mvn/settings.xml -q -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          mvn -s ../.mvn/settings.xml -q -B versions:set-property -Dproperty=nrepl4j.version -DnewVersion="$RELEASE_VERSION"

      - name: Install nrepl4j locally (dependency of the starter)
        run: mvn -s .mvn/settings.xml -B clean install

      - name: Publish nrepl4j to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: mvn -s .mvn/settings.xml -B -Prelease -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" deploy

      - name: Publish nrepl4j-spring-boot-starter to Maven Central
        working-directory: spring-boot-starter
        env:
          CENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: mvn -s ../.mvn/settings.xml -B -Prelease -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" clean deploy
